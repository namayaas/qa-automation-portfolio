name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run catches breakage in the public systems under test even when no code changed.
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager fetches the matching driver.
      - name: Run ${{ matrix.suite }} suite
        run: ./mvnw -B test -Dsuite=${{ matrix.suite }}

      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-test-reports
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 14
